name: Build assets
on:
  workflow_call:
    inputs:
      workingDirectory:
        description: The directory to run this workflow in
        default: ""
        required: false
        type: string
      applicationType:
        description: The type of project this is, release and deployment wise
        default: ""
        required: false
        type: string
      runsOn:
        description: Define on which runner to run workflows where order doesn't matter should run
        default: "ubuntu-latest"
        required: true
        type: string
      distBall:
        description: The path to the static files to be synced to S3
        default: "milestone-dist"
        required: true
        type: string
      commands:
        description: The commands to execute
        default: ""
        required: true
        type: string
      commandsOutputPath:
        description: Where to get to resulting files from the commands
        default: ""
        required: true
        type: string
      artifactBackend:
        description: "Where to stage cross-job CI artifacts: github or s3"
        default: "github"
        required: false
        type: string
      artifactRetentionDays:
        description: Number of days to retain uploaded artifacts
        default: 1
        required: false
        type: number
      ciArtifactsS3BucketSecret:
        default: "CI_ARTIFACTS_S3_BUCKET"
        required: false
        type: string
      ciArtifactsAwsAccessKeyIDSecret:
        default: "CI_ARTIFACTS_AWS_KEY"
        required: false
        type: string
      ciArtifactsAwsSecretAccessKeySecret:
        default: "CI_ARTIFACTS_AWS_SECRET"
        required: false
        type: string
      ciArtifactsAwsRegionSecret:
        default: "CI_ARTIFACTS_S3_REGION"
        required: false
        type: string
      ciArtifactsAwsEndpointUrlSecret:
        default: "CI_ARTIFACTS_S3_ENDPOINT"
        required: false
        type: string
jobs:
  build-assets:
    name: Run commands to build assets
    runs-on: ${{ inputs.runsOn }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run commands
        run: ${{ inputs.commands }}
        working-directory: ${{ inputs.workingDirectory }}
      - name: Archive build output
        run: tar -czf "${{ inputs.distBall }}.tar.gz" -C "${{ inputs.commandsOutputPath }}" .
        working-directory: ${{ inputs.workingDirectory }}
      - name: Upload build artifact
        uses: $/.github/actions/ci-artifacts-upload
        with:
          backend: ${{ inputs.artifactBackend }}
          artifactName: ${{ inputs.distBall }}
          path: ${{ inputs.workingDirectory }}${{ inputs.distBall }}.tar.gz
          retentionDays: ${{ inputs.artifactRetentionDays }}
          s3Bucket: ${{ secrets[inputs.ciArtifactsS3BucketSecret] }}
          s3KeyPrefix: ${{ github.run_id }}/${{ github.run_attempt }}/${{ inputs.distBall }}
          awsAccessKeyId: ${{ secrets[inputs.ciArtifactsAwsAccessKeyIDSecret] }}
          awsSecretAccessKey: ${{ secrets[inputs.ciArtifactsAwsSecretAccessKeySecret] }}
          awsRegion: ${{ secrets[inputs.ciArtifactsAwsRegionSecret] }}
          awsEndpointUrl: ${{ secrets[inputs.ciArtifactsAwsEndpointUrlSecret] }}
