name: Package
on:
  workflow_call:
    inputs:
      dependencyUpdaters:
        description: CSV list of bot AppId's that create PR's to updated dependencies like RenovateBot and DependaBot
        default: 49699333
        required: false
        type: string
      jsonPattern:
        description: The pattern to match which JSON files to check
        default: "\\.json$"
        required: false
        type: string
      workingDirectory:
        description: The directory to run this workflow in
        default: ""
        required: false
        type: string
      services:
        description: Any additional services to use
        default: "{}"
        required: false
        type: string
      env:
        description: Any additional environment variables
        default: "{}"
        required: false
        type: string
      disableMarkdownLinkCheck:
        description: Disable the checking of links in markdown files
        default: false
        required: false
        type: boolean
      disableComposerLockDiff:
        description: Disable the diffing of composer lock files
        default: false
        required: false
        type: boolean
      disableRequiredLabels:
        description: Disable failing PR's when certain labels are missing
        default: false
        required: false
        type: boolean
      runsOnChaos:
        description: Define on which runner to run workflows where order doesn't matter should run
        default: "ubuntu-latest"
        required: false
        type: string
      runsOnOrder:
        description: Define on which runner to run workflows where order matters should run
        default: "ubuntu-latest"
        required: false
        type: string
      runsOnQASteps:
        description: Define on which runner to run workflows where QA ssteps should run
        default: "ubuntu-latest"
        required: false
        type: string
      dockerfile:
        description: The Dockerfile to build
        default: ""
        required: false
        type: string
      dockerBuildTarget:
        description: Value for the --target flag
        default: ""
        required: false
        type: string
      dockerBuildExtraArguments:
        description: Extra arguments to pass to the docker build command
        required: false
        type: string
      ociPlatforms:
        description: The platforms to build the OCI image for, empty means autodetect
        default: ""
        required: false
        type: string
      ociSpreadBuild:
        description: Spread the build OCI images over different runners
        default: false
        required: false
        type: string
      ociPushSecretSecret:
        description: The secret name that holds the token to push OCI images to GHCR.io
        default: "GITHUB_TOKEN"
        required: false
        type: string
      ociSparseCheckout:
        description: Sparse checkout patterns in cone mode
        default: ""
        required: false
        type: string
      ociRegistry:
        description: The secret name that holds the token to push OCI images to GHCR.io
        default: "ghcr.io"
        required: false
        type: string
      ociPlatformRunnerSuffixMap:
        description: Map that maps the platform to the runner suffix
        default: "{\"linux/arm64\": \"-arm64\", \"linux/amd64\": \"-amd64\"}"
        required: false
        type: string
      markdownLinkCheckSparseCheckout:
        description: Additional files/patterns for the sparse checkout
        default: ""
        required: false
        type: string
      artifactRetentionDays:
        description: Number of days to retain uploaded artifacts
        default: 1
        required: false
        type: number
      artifactBackend:
        description: "Where to stage cross-job CI artifacts: github or s3"
        default: "github"
        required: false
        type: string
      ciArtifactsS3BucketSecret:
        description: Secret name for the CI artifacts S3 bucket
        default: "CI_ARTIFACTS_S3_BUCKET"
        required: false
        type: string
      ciArtifactsAwsAccessKeyIDSecret:
        description: Secret name for CI artifacts S3 access key ID
        default: "CI_ARTIFACTS_AWS_KEY"
        required: false
        type: string
      ciArtifactsAwsSecretAccessKeySecret:
        description: Secret name for CI artifacts S3 secret access key
        default: "CI_ARTIFACTS_AWS_SECRET"
        required: false
        type: string
      ciArtifactsAwsRegionSecret:
        description: Secret name for CI artifacts S3 region
        default: "CI_ARTIFACTS_S3_REGION"
        required: false
        type: string
      ciArtifactsAwsEndpointUrlSecret:
        description: Secret name for CI artifacts S3 endpoint URL
        default: "CI_ARTIFACTS_S3_ENDPOINT"
        required: false
        type: string
jobs:
  ci:
    name: Continuous Integration
    uses: $/.github/workflows/ci.yaml
    with:
      jsonPattern: ${{ inputs.jsonPattern }}
      workingDirectory: ${{ inputs.workingDirectory }}
      services: ${{ inputs.services }}
      env: ${{ inputs.env }}
      isProject: true
      runsOnChaos: ${{ inputs.runsOnChaos }}
      runsOnOrder: ${{ inputs.runsOnOrder }}
      runsOnQASteps: ${{ inputs.runsOnQASteps }}
  oci-tag:
    name: OCI Tag
    needs:
      - ci
    runs-on: ${{ inputs.runsOnChaos }}
    outputs:
      tag: ${{ steps.lower-case-tag.outputs.tag }}
    steps:
      - name: Tag
        id: lower-case-tag
        run: printf "tag=%s\n" $(echo "${{ github.repository }}:sha-${{ github.sha }}" | tr '[:upper:]' '[:lower:]') >> $GITHUB_OUTPUT
  oci-build-single:
    name: OCI Image Build
    if: inputs.dockerfile != '' && !inputs.ociSpreadBuild
    needs:
      - oci-tag
    uses: $/.github/workflows/oci-build-single.yaml
    secrets: inherit
    with:
      runsOn: ${{ inputs.runsOnChaos }}
      dockerfile: ${{ inputs.dockerfile }}
      dockerBuildTarget: ${{ inputs.dockerBuildTarget }}
      dockerBuildExtraArguments: ${{ inputs.dockerBuildExtraArguments }}
      tag: ${{ needs.oci-tag.outputs.tag }}
      ociPlatforms: ${{ inputs.ociPlatforms }}
      ociPushSecretSecret: ${{ inputs.ociPushSecretSecret }}
      ociSparseCheckout:  ${{ inputs.ociSparseCheckout }}
  oci-build-spread:
    name: OCI Image Build
    if: inputs.dockerfile != '' && inputs.ociSpreadBuild
    needs:
      - oci-tag
    uses: $/.github/workflows/oci-build-spread.yaml
    secrets: inherit
    with:
      runsOn: ${{ inputs.runsOnChaos }}
      dockerfile: ${{ inputs.dockerfile }}
      dockerBuildTarget: ${{ inputs.dockerBuildTarget }}
      dockerBuildExtraArguments: ${{ inputs.dockerBuildExtraArguments }}
      tag: ${{ needs.oci-tag.outputs.tag }}
      ociPlatforms: ${{ inputs.ociPlatforms }}
      ociPushSecretSecret: ${{ inputs.ociPushSecretSecret }}
      ociSparseCheckout:  ${{ inputs.ociSparseCheckout }}
      artifactRetentionDays: ${{ inputs.artifactRetentionDays }}
      artifactBackend: ${{ inputs.artifactBackend }}
      ciArtifactsS3BucketSecret: ${{ inputs.ciArtifactsS3BucketSecret }}
      ciArtifactsAwsAccessKeyIDSecret: ${{ inputs.ciArtifactsAwsAccessKeyIDSecret }}
      ciArtifactsAwsSecretAccessKeySecret: ${{ inputs.ciArtifactsAwsSecretAccessKeySecret }}
      ciArtifactsAwsRegionSecret: ${{ inputs.ciArtifactsAwsRegionSecret }}
      ciArtifactsAwsEndpointUrlSecret: ${{ inputs.ciArtifactsAwsEndpointUrlSecret }}
  markdown-link-check:
    name: Check Markdown links
    if: false
#    if: inputs.disableMarkdownLinkCheck == false && github.event_name == 'pull_request'
    uses: $/.github/workflows/markdown-check-links.yaml
    with:
      runsOn: ${{ inputs.runsOnChaos }}
      workingDirectory: ${{ inputs.workingDirectory }}
      markdownLinkCheckSparseCheckout: ${{ inputs.markdownLinkCheckSparseCheckout }}
