name: Deploy Service to Kubernetes
on:
  workflow_call:
    inputs:
      version:
        description: The version to deploy
        required: true
        type: string
      runsOnChaos:
        description: Define on which runner to run workflows where order doesn't matter should run
        default: "ubuntu-latest"
        required: false
        type: string
      runsOnOrder:
        description: Define on which runner to run workflows where order matters should run
        default: "ubuntu-latest"
        required: false
        type: string
      helmReleaseName:
        description: The name of the helm release
        default: ""
        required: true
        type: string
      helmReleaseValueName:
        description: The name of the value to use for releases
        default: ""
        required: true
        type: string
      helmDirectory:
        description: The directory to run this workflow in
        default: ""
        required: true
        type: string
      helmSparseCheckout:
        description: Additional files/patterns for the sparse checkout
        default: ""
        required: false
        type: string
      helmAdditionalArguments:
        description: The directory to run this workflow in
        default: ""
        required: true
        type: string
      helmUpdateAppVersion:
        description: Update the helm charts appVersion with the passed version
        default: false
        required: true
        type: boolean
      kubeConfigSecret:
        description: The secret name that holds the kubeconfig to connect with Kubernetes
        required: true
        type: string
      terraformDirectory:
        description: The directory to run this workflow in
        default: ""
        required: true
        type: string
      terraformSparseCheckout:
        description: Additional files/patterns for the sparse checkout
        default: ""
        required: false
        type: string
      terraformVars:
        description: The directory to run this workflow in
        default: ""
        required: true
        type: string
      terraformParallelism:
        description: Value for the -parallelism plan/apply flag
        default: 13
        required: true
        type: number
      terraformLogLevel:
        description: Value for the TF_LOG environment value
        default: ""
        required: true
        type: string
      ociRetag:
        description: Whether or not to retag OCI images with the release tag
        default: false
        required: true
        type: boolean
      ociPushSecretSecret:
        description: The secret name that holds the token to push OCI images to GHCR.io
        default: "GITHUB_TOKEN"
        required: true
        type: string
      artifactBackend:
        default: "github"
        required: false
        type: string
      artifactRetentionDays:
        default: 1
        required: false
        type: number
      ciArtifactsS3BucketSecret:
        default: "CI_ARTIFACTS_S3_BUCKET"
        required: false
        type: string
      ciArtifactsAwsAccessKeyIDSecret:
        default: "CI_ARTIFACTS_AWS_KEY"
        required: false
        type: string
      ciArtifactsAwsSecretAccessKeySecret:
        default: "CI_ARTIFACTS_AWS_SECRET"
        required: false
        type: string
      ciArtifactsAwsRegionSecret:
        default: "CI_ARTIFACTS_S3_REGION"
        required: false
        type: string
      ciArtifactsAwsEndpointUrlSecret:
        default: "CI_ARTIFACTS_S3_ENDPOINT"
        required: false
        type: string
jobs:
  terraform-apply:
    name: Terraform Apply
    if: inputs.terraformDirectory != ''
    uses: $/.github/workflows/terraform-apply.yaml
    secrets: inherit
    with:
      runsOn: ${{ inputs.runsOnOrder }}
      terraformDirectory: ${{ inputs.terraformDirectory }}
      terraformSparseCheckout: ${{ inputs.terraformSparseCheckout }}
      terraformVars: ${{ inputs.terraformVars }}
      terraformParallelism: ${{ inputs.terraformParallelism }}
      terraformLogLevel: ${{ inputs.terraformLogLevel }}
      kubeConfigSecret: ${{ inputs.kubeConfigSecret }}
  image-retag:
    name: OCI Image Re-tag
    if: inputs.ociRetag
    uses: $/.github/workflows/oci-retag.yaml
    secrets: inherit
    with:
      runsOn: ${{ inputs.runsOnChaos }}
      from: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
      to: ghcr.io/${{ github.repository }}:${{ inputs.version }}
      ociPushSecretSecret: ${{ inputs.ociPushSecretSecret }}
  helm-deploy:
    name: Helm Deploy
    needs:
      - terraform-apply
      - image-retag
    uses: $/.github/workflows/helm-deploy.yaml
    secrets: inherit
    with:
      runsOnChaos: ${{ inputs.runsOnChaos }}
      runsOnOrder: ${{ inputs.runsOnOrder }}
      version: ${{ inputs.version }}
      helmReleaseName: ${{ inputs.helmReleaseName }}
      helmReleaseValueName: ${{ inputs.helmReleaseValueName }}
      helmDirectory: ${{ inputs.helmDirectory }}
      helmSparseCheckout: ${{ inputs.helmSparseCheckout }}
      helmAdditionalArguments: ${{ inputs.helmAdditionalArguments }}
      helmUpdateAppVersion: ${{ inputs.helmUpdateAppVersion }}
      kubeConfigSecret: ${{ inputs.kubeConfigSecret }}
      artifactBackend: ${{ inputs.artifactBackend }}
      artifactRetentionDays: ${{ inputs.artifactRetentionDays }}
      ciArtifactsS3BucketSecret: ${{ inputs.ciArtifactsS3BucketSecret }}
      ciArtifactsAwsAccessKeyIDSecret: ${{ inputs.ciArtifactsAwsAccessKeyIDSecret }}
      ciArtifactsAwsSecretAccessKeySecret: ${{ inputs.ciArtifactsAwsSecretAccessKeySecret }}
      ciArtifactsAwsRegionSecret: ${{ inputs.ciArtifactsAwsRegionSecret }}
      ciArtifactsAwsEndpointUrlSecret: ${{ inputs.ciArtifactsAwsEndpointUrlSecret }}
