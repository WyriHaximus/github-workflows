name: OCI Image Build

on:
  workflow_call:
    inputs:
      runsOn:
        description: Define on which runner this workflow should run
        default: "ubuntu-latest"
        required: false
        type: string
      dockerfile:
        description: The Dockerfile to build
        required: true
        type: string
      dockerBuildTarget:
        description: Value for the --target flag
        default: ""
        required: false
        type: string
      dockerBuildExtraArguments:
        description: Extra arguments to pass to the docker build command
        required: false
        type: string
      tag:
        description: The tag for the image we're building
        required: true
        type: string
      ociPlatforms:
        description: The platforms to build the OCI image for, empty means autodetect
        default: ""
        required: false
        type: string
      ociPushSecretSecret:
        description: The secret name that holds the token to push OCI images to GHCR.io
        default: "GITHUB_TOKEN"
        required: false
        type: string
      ociSparseCheckout:
        description: Sparse checkout patterns in cone mode
        default: ""
        required: false
        type: string
      ociRegistry:
        description: The secret name that holds the token to push OCI images to ghcr.io
        default: "ghcr.io"
        required: false
        type: string
      ociPlatformRunnerSuffixMap:
        description: Map that maps the platform to the runner suffix
        default: "{\"linux/arm64\": \"-arm64\", \"linux/amd64\": \"-amd64\"}"
        required: false
        type: string
      artifactRetentionDays:
        description: Number of days to retain uploaded artifacts
        default: 1
        required: false
        type: number
      artifactBackend:
        description: "Where to stage cross-job CI artifacts: github or s3"
        default: "github"
        required: false
        type: string
      ciArtifactsS3BucketSecret:
        description: Secret name for the CI artifacts S3 bucket
        default: "CI_ARTIFACTS_S3_BUCKET"
        required: false
        type: string
      ciArtifactsAwsAccessKeyIDSecret:
        description: Secret name for CI artifacts S3 access key ID
        default: "CI_ARTIFACTS_AWS_KEY"
        required: false
        type: string
      ciArtifactsAwsSecretAccessKeySecret:
        description: Secret name for CI artifacts S3 secret access key
        default: "CI_ARTIFACTS_AWS_SECRET"
        required: false
        type: string
      ciArtifactsAwsRegionSecret:
        description: Secret name for CI artifacts S3 region
        default: "CI_ARTIFACTS_S3_REGION"
        required: false
        type: string
      ciArtifactsAwsEndpointUrlSecret:
        description: Secret name for CI artifacts S3 endpoint URL
        default: "CI_ARTIFACTS_S3_ENDPOINT"
        required: false
        type: string
jobs:
  supported-platform-matrix:
    name: Supported Platform Matrix
    runs-on: ${{ inputs.runsOn }}
    outputs:
      platform: ${{ steps.supported-platform-matrix.outputs.platform }}
      platform_csv: ${{ steps.supported-platform-matrix.outputs.platform_csv }}
    steps:
      - id: supported-platform-matrix
        name: Generate Arch
        uses: wyrihaximus/github-action-oci-image-supported-platforms@e85320eed654eed6c3db49c00f866f53c08663a6 # v1.0.0
        with:
          dockerfile: ${{ inputs.dockerfile }}
  oci-build:
    name: OCI Image Build (${{ matrix.platform }})
    runs-on: ${{ inputs.runsOn }}${{ fromJson(inputs.ociPlatformRunnerSuffixMap)[matrix.platform] }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.supported-platform-matrix.outputs.platform) }}
    needs:
      - supported-platform-matrix
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          printf "PLATFORM_ARCH=%s" $(echo "${{ matrix.platform }}" | cut -d "/" -f 2) >> $GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ${{ inputs.ociSparseCheckout }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.ociRegistry }}
          username: ${{ github.actor }}
          password: ${{ secrets[inputs.ociPushSecretSecret] }}
      - name: Set up QEMU
        if: inputs.runsOn == 'ubuntu-latest'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up QEMU
        if: inputs.runsOn != 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          platforms: ${{ inputs.ociPlatforms != '' && inputs.ociPlatforms || needs.supported-platform-matrix.outputs.platform_csv }}
      - name: Inspect builder
        run: |
          echo "Name:      ${{ steps.buildx.outputs.name }}"
          echo "Driver:    ${{ steps.buildx.outputs.driver }}"
          echo "Platforms: ${{ steps.buildx.outputs.platforms }}"
          echo "Nodes:     ${{ steps.buildx.outputs.nodes }}"
      - run: mkdir -p ./docker-image/
      - run: echo "docker tag ${{ inputs.ociRegistry }}/${{ inputs.tag }}-${{ env.PLATFORM_ARCH }} localhost:5000/${{ inputs.tag }}-${{ env.PLATFORM_ARCH }}" >> ./docker-image/tag-push-${{ env.PLATFORM_PAIR }}.sh
      - run: echo "docker push localhost:5000/${{ inputs.tag }}-${{ env.PLATFORM_ARCH }}" >> ./docker-image/tag-push-${{ env.PLATFORM_PAIR }}.sh
      - name: Build image
        run: docker build --platform=${{ matrix.platform }} -f ${{ inputs.dockerfile }} -t ${{ inputs.ociRegistry }}/${{ inputs.tag }}-${{ env.PLATFORM_ARCH }} --label org.opencontainers.image.revision=${{ github.sha }} --label org.opencontainers.image.source=https://github.com/${{ github.repository }} --annotation "org.opencontainers.image.revision=${{ github.sha }}" --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" . ${{ inputs.dockerBuildTarget != '' && format('--target={0}', inputs.dockerBuildTarget) || ''}} ${{ inputs.dockerBuildExtraArguments }}
      - run: docker save ${{ inputs.ociRegistry }}/${{ inputs.tag }}-${{ env.PLATFORM_ARCH }} -o ./docker-image/docker_image-${{ env.PLATFORM_PAIR }}.tar
      - name: Upload Images
        uses: $/.github/actions/ci-artifacts-upload
        with:
          backend: ${{ inputs.artifactBackend }}
          artifactName: docker-image-${{ github.sha }}-${{ env.PLATFORM_PAIR }}
          path: ./docker-image
          retentionDays: ${{ inputs.artifactRetentionDays }}
          s3Bucket: ${{ secrets[inputs.ciArtifactsS3BucketSecret] }}
          s3KeyPrefix: ${{ github.run_id }}/${{ github.run_attempt }}/docker-image-${{ github.sha }}-${{ env.PLATFORM_PAIR }}
          awsAccessKeyId: ${{ secrets[inputs.ciArtifactsAwsAccessKeyIDSecret] }}
          awsSecretAccessKey: ${{ secrets[inputs.ciArtifactsAwsSecretAccessKeySecret] }}
          awsRegion: ${{ secrets[inputs.ciArtifactsAwsRegionSecret] }}
          awsEndpointUrl: ${{ secrets[inputs.ciArtifactsAwsEndpointUrlSecret] }}
  oci-merge-and-push:
    name: OCI Combine and Push
    needs:
      - oci-build
      - supported-platform-matrix
    runs-on: ${{ inputs.runsOn }}
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          printf "PLATFORM_ARCH=%s" $(echo "${{ matrix.platform }}" | cut -d "/" -f 2) >> $GITHUB_ENV
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.ociRegistry }}
          username: ${{ github.actor }}
          password: ${{ secrets[inputs.ociPushSecretSecret] }}
      - name: Set up QEMU
        if: inputs.runsOn == 'ubuntu-latest'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up QEMU
        if: inputs.runsOn != 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
          platforms: ${{ inputs.ociPlatforms != '' && inputs.ociPlatforms || steps.platform.outputs.platform_csv }}
      - name: Inspect builder
        run: |
          echo "Name:      ${{ steps.buildx.outputs.name }}"
          echo "Driver:    ${{ steps.buildx.outputs.driver }}"
          echo "Platforms: ${{ steps.buildx.outputs.platforms }}"
          echo "Nodes:     ${{ steps.buildx.outputs.nodes }}"
      - name: Download Images
        uses: $/.github/actions/ci-artifacts-download
        with:
          backend: ${{ inputs.artifactBackend }}
          artifactPattern: docker-image-${{ github.sha }}-*
          downloadPath: /tmp/docker-image
          mergeMultiple: "true"
          s3Bucket: ${{ secrets[inputs.ciArtifactsS3BucketSecret] }}
          s3RunPrefix: ${{ github.run_id }}/${{ github.run_attempt }}/
          s3SyncLayout: flat
          awsAccessKeyId: ${{ secrets[inputs.ciArtifactsAwsAccessKeyIDSecret] }}
          awsSecretAccessKey: ${{ secrets[inputs.ciArtifactsAwsSecretAccessKeySecret] }}
          awsRegion: ${{ secrets[inputs.ciArtifactsAwsRegionSecret] }}
          awsEndpointUrl: ${{ secrets[inputs.ciArtifactsAwsEndpointUrlSecret] }}
      - run: |
          for f in /tmp/docker-image/docker_image-*.tar; do
            docker load --input $f
          done
      - run: docker images
      - run: cat /tmp/docker-image/tag-push-*.sh | sh
      - run: echo "FROM localhost:5000/${{ inputs.tag }}-\${TARGETARCH}" >> docker-file-push
      - run: docker buildx build -f docker-file-push -t ${{ inputs.ociRegistry }}/${{ inputs.tag }} --platform=${{ needs.supported-platform-matrix.outputs.platform_csv }} --label org.opencontainers.image.revision=${{ github.sha }} --label org.opencontainers.image.source=https://github.com/${{ github.repository }} --output=type=registry .
      - name: Clean up CI artifacts on S3
        if: inputs.artifactBackend == 's3' && success()
        uses: $/.github/actions/ci-artifacts-aws-config
        with:
          awsAccessKeyId: ${{ secrets[inputs.ciArtifactsAwsAccessKeyIDSecret] }}
          awsSecretAccessKey: ${{ secrets[inputs.ciArtifactsAwsSecretAccessKeySecret] }}
          awsRegion: ${{ secrets[inputs.ciArtifactsAwsRegionSecret] }}
          awsEndpointUrl: ${{ secrets[inputs.ciArtifactsAwsEndpointUrlSecret] }}
      - name: Delete run prefix on S3
        if: inputs.artifactBackend == 's3' && success()
        env:
          CI_ARTIFACTS_S3_BUCKET: ${{ secrets[inputs.ciArtifactsS3BucketSecret] }}
          CI_ARTIFACTS_S3_ENDPOINT: ${{ secrets[inputs.ciArtifactsAwsEndpointUrlSecret] }}
        run: |
          set -euo pipefail
          endpoint_args=()
          if [ -n "${CI_ARTIFACTS_S3_ENDPOINT}" ]; then
            endpoint_args=(--endpoint-url "${CI_ARTIFACTS_S3_ENDPOINT}")
          fi
          aws s3 rm "s3://${CI_ARTIFACTS_S3_BUCKET}/${{ github.run_id }}/${{ github.run_attempt }}/" --recursive "${endpoint_args[@]}"
