name: Helm Deploy

on:
  workflow_call:
    inputs:
      version:
        description: The version to deploy
        required: true
        type: string
      runsOnChaos:
        description: Define on which runner to run workflows where order doesn't matter should run
        default: "ubuntu-latest"
        required: false
        type: string
      runsOnOrder:
        description: Define on which runner to run workflows where order matters should run
        default: "ubuntu-latest"
        required: false
        type: string
      workingDirectory:
        description: The directory to run this workflow in
        default: ""
        required: false
        type: string
      helmReleaseName:
        description: The name of the helm release
        default: ""
        required: true
        type: string
      helmReleaseValueName:
        description: The name of the value to use for releases
        default: ""
        required: true
        type: string
      helmDirectory:
        description: The directory to run this workflow in
        default: ""
        required: true
        type: string
      helmSparseCheckout:
        description: Additional files/patterns for the sparse checkout
        default: ""
        required: false
        type: string
      helmAdditionalArguments:
        description: The directory to run this workflow in
        default: ""
        required: false
        type: string
      helmUpdateAppVersion:
        description: Update the helm charts appVersion with the passed version
        default: false
        required: false
        type: boolean
      kubeConfigSecret:
        description: The secret name that holds the kubeconfig to connect with Kubernetes
        required: true
        type: string
      artifactBackend:
        default: "github"
        required: false
        type: string
      artifactRetentionDays:
        default: 1
        required: false
        type: number
      ciArtifactsS3BucketSecret:
        default: "CI_ARTIFACTS_S3_BUCKET"
        required: false
        type: string
      ciArtifactsAwsAccessKeyIDSecret:
        default: "CI_ARTIFACTS_AWS_KEY"
        required: false
        type: string
      ciArtifactsAwsSecretAccessKeySecret:
        default: "CI_ARTIFACTS_AWS_SECRET"
        required: false
        type: string
      ciArtifactsAwsRegionSecret:
        default: "CI_ARTIFACTS_S3_REGION"
        required: false
        type: string
      ciArtifactsAwsEndpointUrlSecret:
        default: "CI_ARTIFACTS_S3_ENDPOINT"
        required: false
        type: string
jobs:
  helm-dependencies:
    uses: $/.github/workflows/helm-dependencies.yaml
    with:
      runsOn: ${{ inputs.runsOnChaos }}
      workingDirectory: ${{ inputs.workingDirectory }}
      helmDirectory: ${{ inputs.helmDirectory }}
      helmSparseCheckout: ${{ inputs.helmSparseCheckout }}
  helm-deploy-prepare:
    name: Build Chart
    needs: helm-dependencies
    runs-on: ${{ inputs.runsOnOrder }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            !${{ inputs.workingDirectory }}/*
            /${{ inputs.workingDirectory }}${{ inputs.helmDirectory }}*
            ${{ inputs.helmSparseCheckout }}
      - name: Prep helm chart
        if: inputs.helmUpdateAppVersion
        run: |
          mv ${{ inputs.workingDirectory }}${{ inputs.helmDirectory }}Chart.yaml ${{ inputs.workingDirectory }}${{ inputs.helmDirectory }}Chart.old.yaml &&
          cat ${{ inputs.workingDirectory }}${{ inputs.helmDirectory }}Chart.old.yaml | grep -v appVersion > ${{ inputs.workingDirectory }}${{ inputs.helmDirectory }}Chart.yaml &&
          rm ${{ inputs.workingDirectory }}${{ inputs.helmDirectory }}Chart.old.yaml
          echo -e "\r\nappVersion: ${{ inputs.version }}\r\n" >> ${{ inputs.workingDirectory }}${{ inputs.helmDirectory }}Chart.yaml &&
          cat ${{ inputs.workingDirectory }}${{ inputs.helmDirectory }}Chart.yaml
      - name: Determine chart artifact path
        id: chart-artifact
        run: |
          chart="${{ inputs.workingDirectory }}${{ inputs.helmDirectory }}"
          chart="${chart%/}"
          parent="$(dirname "$chart")"
          if [[ "$parent" == "." ]]; then
            echo "path=$chart" >> "$GITHUB_OUTPUT"
          else
            echo "path=$parent" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload chart artifact
        uses: $/.github/actions/ci-artifacts-upload
        with:
          backend: ${{ inputs.artifactBackend }}
          artifactName: helm-chart
          path: ${{ steps.chart-artifact.outputs.path }}
          retentionDays: ${{ inputs.artifactRetentionDays }}
          includeHiddenFiles: "true"
          s3Bucket: ${{ secrets[inputs.ciArtifactsS3BucketSecret] }}
          s3KeyPrefix: ${{ github.run_id }}/${{ github.run_attempt }}/helm-chart
          awsAccessKeyId: ${{ secrets[inputs.ciArtifactsAwsAccessKeyIDSecret] }}
          awsSecretAccessKey: ${{ secrets[inputs.ciArtifactsAwsSecretAccessKeySecret] }}
          awsRegion: ${{ secrets[inputs.ciArtifactsAwsRegionSecret] }}
          awsEndpointUrl: ${{ secrets[inputs.ciArtifactsAwsEndpointUrlSecret] }}
  helm-deploy-exec:
    name: Deploy Release
    needs:
      - helm-dependencies
      - helm-deploy-prepare
    uses: $/.github/workflows/helm-exec.yaml
    secrets: inherit
    with:
      runsOn: ${{ inputs.runsOnOrder }}
      kubeConfigSecret: ${{ inputs.kubeConfigSecret }}
      artifactName: helm-chart
      chartPath: ${{ inputs.workingDirectory }}${{ inputs.helmDirectory }}
      artifactBackend: ${{ inputs.artifactBackend }}
      artifactRetentionDays: ${{ inputs.artifactRetentionDays }}
      ciArtifactsS3BucketSecret: ${{ inputs.ciArtifactsS3BucketSecret }}
      ciArtifactsAwsAccessKeyIDSecret: ${{ inputs.ciArtifactsAwsAccessKeyIDSecret }}
      ciArtifactsAwsSecretAccessKeySecret: ${{ inputs.ciArtifactsAwsSecretAccessKeySecret }}
      ciArtifactsAwsRegionSecret: ${{ inputs.ciArtifactsAwsRegionSecret }}
      ciArtifactsAwsEndpointUrlSecret: ${{ inputs.ciArtifactsAwsEndpointUrlSecret }}
      exec: |
        jq -c '.[]' <<< '${{ needs.helm-dependencies.outputs.repositories }}' | while read -r repo; do
          helm repo add "$(jq -r .name <<< "$repo")" "$(jq -r .url <<< "$repo")"
        done
        helm dependency build ${{ inputs.workingDirectory }}${{ inputs.helmDirectory }}
        helm upgrade --install --wait --atomic --timeout 60m6s ${{ inputs.helmReleaseName }} ${{ inputs.workingDirectory }}${{ inputs.helmDirectory }} --set ${{ inputs.helmReleaseValueName }}=${{ inputs.version }} ${{ inputs.helmAdditionalArguments }}
