name: Deploy assets to CDN
on:
  workflow_call:
    inputs:
      milestone:
        description: The tag to deploy
        required: true
        type: string
      staticFilesPath:
        description: The path to the static files to be synced to S3
        default: "public"
        required: true
        type: string
      workingDirectory:
        description: The directory to run this workflow in
        default: ""
        required: false
        type: string
      runsOn:
        description: Define on which runner to run workflows where order doesn't matter should run
        default: "ubuntu-latest"
        required: true
        type: string
      awsAccessKeyIDSecret:
        description: The secret name that holds the AWS access key ID
        default: "AWS_KEY"
        required: true
        type: string
      awsSecretAccessKeySecret:
        description: The secret name that holds the AWS access key secret
        default: "AWS_SECRET"
        required: true
        type: string
      awsRegionSecret:
        description: The secret name that holds the AWS region
        default: "AWS_REGION"
        required: true
        type: string
      awsEndpointUrlSecret:
        description: The secret name that holds the AWS endpoint URL
        default: "AWS_ENDPOINT_URL"
        required: false
        type: string
      cdnAwsS3BucketSecret:
        description: The secret name that holds the AWS S3 bucket name
        default: "CDN_HOSTED_S3_BUCKET"
        required: true
        type: string
      cdnAwsCloudFrontDistributionIDSecret:
        description: The secret name that holds the AWS cloudfront distribution id
        default: "CDN_HOSTED_DISTRIBUTION_ID"
        required: false
        type: string
      artifactBackend:
        description: "Where to stage cross-job CI artifacts: github or s3"
        default: "github"
        required: false
        type: string
      artifactRetentionDays:
        description: Number of days to retain uploaded artifacts
        default: 1
        required: false
        type: number
      ciArtifactsS3BucketSecret:
        default: "CI_ARTIFACTS_S3_BUCKET"
        required: false
        type: string
      ciArtifactsAwsAccessKeyIDSecret:
        default: "CI_ARTIFACTS_AWS_KEY"
        required: false
        type: string
      ciArtifactsAwsSecretAccessKeySecret:
        default: "CI_ARTIFACTS_AWS_SECRET"
        required: false
        type: string
      ciArtifactsAwsRegionSecret:
        default: "CI_ARTIFACTS_S3_REGION"
        required: false
        type: string
      ciArtifactsAwsEndpointUrlSecret:
        default: "CI_ARTIFACTS_S3_ENDPOINT"
        required: false
        type: string
jobs:
  build-assets:
    name: Zip up static assets for upload
    runs-on: ${{ inputs.runsOn }}
    env:
      awsEndpointUrlSecret: ${{ secrets[inputs.awsEndpointUrlSecret] }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            !${{ inputs.workingDirectory }}/*
            /${{ inputs.workingDirectory }}${{ inputs.staticFilesPath }}*
      - name: Archive static assets
        run: tar -czf "${{ inputs.milestone }}-dist.tar.gz" -C "${{ inputs.staticFilesPath }}" .
        working-directory: ${{ inputs.workingDirectory }}
      - name: Upload build artifact
        uses: $/.github/actions/ci-artifacts-upload
        with:
          backend: ${{ inputs.artifactBackend }}
          artifactName: ${{ inputs.milestone }}-dist
          path: ${{ inputs.workingDirectory }}${{ inputs.milestone }}-dist.tar.gz
          retentionDays: ${{ inputs.artifactRetentionDays }}
          s3Bucket: ${{ secrets[inputs.ciArtifactsS3BucketSecret] }}
          s3KeyPrefix: ${{ github.run_id }}/${{ github.run_attempt }}/${{ inputs.milestone }}-dist
          awsAccessKeyId: ${{ secrets[inputs.ciArtifactsAwsAccessKeyIDSecret] }}
          awsSecretAccessKey: ${{ secrets[inputs.ciArtifactsAwsSecretAccessKeySecret] }}
          awsRegion: ${{ secrets[inputs.ciArtifactsAwsRegionSecret] }}
          awsEndpointUrl: ${{ secrets[inputs.ciArtifactsAwsEndpointUrlSecret] }}
  cdn-hosted-deploy:
    name: Deploy assets to CDN and invalidate caches
    needs:
      - build-assets
    uses: $/.github/workflows/s3-upload.yaml
    secrets: inherit
    with:
      runsOn: ${{ inputs.runsOn }}
      distBall: ${{ inputs.milestone }}-dist
      workingDirectory: ${{ inputs.workingDirectory }}
      awsAccessKeyIDSecret: ${{ inputs.awsAccessKeyIDSecret }}
      awsSecretAccessKeySecret: ${{ inputs.awsSecretAccessKeySecret }}
      awsRegionSecret: ${{ inputs.awsRegionSecret }}
      awsEndpointUrlSecret: ${{ inputs.awsEndpointUrlSecret }}
      cdnAwsS3BucketSecret: ${{ inputs.cdnAwsS3BucketSecret }}
      cdnAwsCloudFrontDistributionIDSecret: ${{ inputs.cdnAwsCloudFrontDistributionIDSecret }}
      artifactBackend: ${{ inputs.artifactBackend }}
      ciArtifactsS3BucketSecret: ${{ inputs.ciArtifactsS3BucketSecret }}
      ciArtifactsAwsAccessKeyIDSecret: ${{ inputs.ciArtifactsAwsAccessKeyIDSecret }}
      ciArtifactsAwsSecretAccessKeySecret: ${{ inputs.ciArtifactsAwsSecretAccessKeySecret }}
      ciArtifactsAwsRegionSecret: ${{ inputs.ciArtifactsAwsRegionSecret }}
      ciArtifactsAwsEndpointUrlSecret: ${{ inputs.ciArtifactsAwsEndpointUrlSecret }}
