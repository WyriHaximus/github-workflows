name: Configure AWS CLI for CI artifacts S3
description: Configures AWS CLI for Bunny S3-compatible endpoints or standard AWS S3
inputs:
  awsAccessKeyId:
    description: AWS access key ID
    required: true
  awsSecretAccessKey:
    description: AWS secret access key
    required: true
  awsRegion:
    description: AWS region
    required: true
  awsEndpointUrl:
    description: S3 endpoint URL; empty for native AWS
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set up AWS CLI credentials
      if: inputs.awsEndpointUrl == ''
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-access-key-id: ${{ inputs.awsAccessKeyId }}
        aws-secret-access-key: ${{ inputs.awsSecretAccessKey }}
        aws-region: ${{ inputs.awsRegion }}
    - name: Set up AWS CLI credentials
      if: inputs.awsEndpointUrl != ''
      shell: bash
      run: |
        aws configure set default.region "${{ inputs.awsRegion }}"
        aws configure set aws_access_key_id "${{ inputs.awsAccessKeyId }}"
        aws configure set aws_secret_access_key "${{ inputs.awsSecretAccessKey }}"
